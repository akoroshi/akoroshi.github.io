<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>akoroshi | Links</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #222;
    --sub: #777;
    --line: #e4e2dd;
    --accent: #3a5a7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b;
      --card: #222327;
      --text: #eee;
      --sub: #999;
      --line: #33353a;
      --accent: #8fb3d9;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: 0.04em; }
  .bio { color: var(--sub); font-size: 0.9rem; margin: 0 0 32px; line-height: 1.7; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.link {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    transition: border-color .15s, transform .15s;
  }
  a.link:hover, a.link:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  footer { margin-top: 40px; color: var(--sub); font-size: 0.75rem; }
</style>
</head>
<body>
<main>
  <h1>akoroshi</h1>
  <div style="height:24px"></div>

  <ul>
    <li><a class="link" href="https://www.youtube.com/@akoroshi3087" target="_blank" rel="noopener noreferrer">YouTube</a></li>
    <li><a class="link" href="https://www.instagram.com/akoroshi0419/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
    <li><a class="link" href="https://www.twitch.tv/akoroshi" target="_blank" rel="noopener noreferrer">Twitch</a></li>
    <li><a class="link" href="https://www.amazon.co.jp/hz/wishlist/ls/1HH5ODFXQY6EX" target="_blank" rel="noopener noreferrer">欲しい物リスト</a></li>
  </ul>

  <footer>© akoroshi</footer>
</main>
</body>
</html>
